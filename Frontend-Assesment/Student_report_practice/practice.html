<!DOCTYPE html>
<html>
<head>
    <title>Practice</title>
</head>

<body bgcolor="#eeeeee">

    <!-- Students Report -->
    <table border="1" cellspacing="0" cellpadding="8" align="center">
        <caption>
            <font size="5">Students Report</font>
        </caption>

        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Result</th>
        </tr>

        <tr>
            <th>Grade</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>Rohan</td>
            <td>A+</td>
            <td>Pass</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>A</td>
            <td>Pass</td>
        </tr>

        <tr>
            <th colspan="2">Total Students</th>
            <td>2</td>
        </tr>
    </table>


    <br><br><br><br><br><br>


    <!-- Bottom Tables -->
    <table width="100%" cellspacing="0" cellpadding="0">
        <tr>

            <!-- Shopping Bill -->
            <td align="left">

                <table border="1" cellspacing="0" cellpadding="8">
                    <caption>
                        <font size="5">Shopping Bill</font>
                    </caption>

                    <tr>
                        <th rowspan="2">Item</th>
                        <th colspan="2">Price</th>
                        <th rowspan="2">Quantity</th>
                    </tr>

                    <tr>
                        <th>Unit</th>
                        <th>Total</th>
                    </tr>

                    <tr>
                        <td>Apple</td>
                        <td>₹20</td>
                        <td>₹60</td>
                        <td>3</td>
                    </tr>

                    <tr>
                        <td>Milk</td>
                        <td>₹50</td>
                        <td>₹100</td>
                        <td>2</td>
                    </tr>

                    <tr>
                        <th colspan="3">Grand Total</th>
                        <th>₹160</th>
                    </tr>
                </table>

            </td>


            <!-- Student Report -->
            <td align="right">

                <table border="1" cellspacing="0" cellpadding="8">
                    <caption>
                        <font size="5">Student Report</font>
                    </caption>

                    <tr>
                        <th rowspan="2">Name</th>
                        <th colspan="2">Marks</th>
                        <th rowspan="2">Result</th>
                    </tr>

                    <tr>
                        <th>Math</th>
                        <th>English</th>
                    </tr>

                    <tr>
                        <td>Rohan</td>
                        <td>90</td>
                        <td>85</td>
                        <td>Pass</td>
                    </tr>

                    <tr>
                        <td>Priya</td>
                        <td>95</td>
                        <td>88</td>
                        <td>Pass</td>
                    </tr>

                    <tr>
                        <th colspan="3">Total Marks</th>
                        <th>358</th>
                    </tr>

                </table>

            </td>

        </tr>
    </table>

</body>
</html>
