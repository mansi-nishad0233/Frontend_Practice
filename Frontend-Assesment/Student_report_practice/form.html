<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>

<form>

    Name:
    <input type="text" placeholder="Enter your name">
    <br><br>

    Password:
    <input type="password" placeholder="Enter your password">
    <br><br>

    Gender:
    Male <input type="radio" name="gender">
    Female <input type="radio" name="gender">
    <br><br>

    Hobbies:
    Reading <input type="checkbox">
    Gaming <input type="checkbox">
    Traveling <input type="checkbox">
    <br><br>

    Email:
    <input type="email" placeholder="Enter your email">
    <br><br>

    Address:<br>
    <textarea rows="5" cols="40" placeholder="Enter your address"></textarea>
    <br><br>

    Course:
    <select>
        <option>Computer Science</option>
        <option>Information Technology</option>
        <option>Data Science</option>
        <option>Web Development</option>
    </select>
    <br><br>

    <input type="submit" value="Submit">

    
</form>

    <audio controls>
    <source src="audio.mp3" type="audio/mpeg">
</audio>

    <br><br>
    

    <video width="400" height="250" controls>
        <source src="Video.mp4" type="video/mp4">
    </video>


    <br><br>

    <iframe width="560" height="315"
    src="https://www.youtube.com/embed/qzN7UY4D8VQ?si=9gHEgJp9OV8RQvKS"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>

<br><br>

</body>
</html>
